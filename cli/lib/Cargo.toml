[package]
name = "deno_lib"
version = "0.71.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Shared code between the Deno CLI and denort"

[lib]
path = "lib.rs"

[features]
# @ref LLP 0019#frozen-parent-standalone-allowlist-and-byte-graph [implements] --
# This shared feature compiles only the private inert generated-byte sibling.
__oden_parent_allowlist_embedded = []

[dependencies]
arc-swap.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
boxed_error.workspace = true
capacity_builder.workspace = true
# @ref LLP 0019#checked-final-lto-target-policy [implements] -- Strict
# pure-Ed25519 point/scalar/subgroup verification for the target-policy
# registry approval; already a workspace dependency via ed25519-dalek users.
curve25519-dalek.workspace = true
deno_bundle_runtime.workspace = true
deno_error.workspace = true
deno_fs = { workspace = true, features = ["sync_fs"] }
deno_media_type.workspace = true
deno_node = { workspace = true, features = ["sync_fs"] }
deno_npm.workspace = true
deno_npm_installer.workspace = true
deno_path_util.workspace = true
deno_resolver = { workspace = true, features = ["sync"] }
deno_runtime.workspace = true
deno_semver.workspace = true
deno_terminal.workspace = true
env_logger.workspace = true
faster-hex.workspace = true
indexmap.workspace = true
libsui.workspace = true
log = { workspace = true, features = ["serde"] }
node_resolver = { workspace = true, features = ["sync"] }
parking_lot.workspace = true
ryu-js.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sys_traits = { workspace = true, features = ["getrandom"] }
thiserror.workspace = true
twox-hash.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
